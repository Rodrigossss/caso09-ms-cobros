name: CI/CD Pipeline - MS Cobros

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código fuente
      uses: actions/checkout@v3

    - name: Configurar JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compilar y ejecutar pruebas con Maven
      run: mvn clean test

    - name: Construir imagen Docker de prueba
      run: docker build -t ms-cobros:latest .
